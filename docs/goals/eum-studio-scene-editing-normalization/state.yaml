    likely_misfire: "오래된 정적 검토를 그대로 구현해 현재 sceneId·삭제 경로를 중복하거나 승인된 projection 경계를 깨는 것."
    blind_spots_considered:
      - "첨부 이후 구현된 stable scene identity와 교차 회차 삭제 수정"
      - "대규모 기존 dirty worktree와 겹치는 장면 controller/runtime/E2E 파일"
      - "승인 ADR의 파생 SceneProjection 원칙과 후속 identity 원장 사이의 실제 계약"
      - "사용자 데이터 파괴 없이 삭제·복원 흐름을 검증할 격리 저장소"
