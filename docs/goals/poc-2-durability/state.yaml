      - "operator approval 필요 항목"
      - "첫 exact Worker objective·allowed_files·verify·stop_if"
    receipt:
      result: done
      decision: "첫 Worker는 renderer·IPC·경로·checksum·batch schedule을 건드리지 않고 application의 직렬 durable save command와 SaveReceipt 계약만 구현한다."
      runtime_map:
        - "CodeMirror update listener가 좌표 전용 ManuscriptTransaction을 ManuscriptEditor.onTransaction으로 전달한다."
        - "App은 현재 transaction을 통계·검색 무효화에만 사용하며 저장 bridge를 호출하지 않는다."
        - "StudioBridge는 세 query channel만 allowlist하며 preload도 같은 세 channel만 invoke한다."
        - "desktop main은 runtime 문서 profile을 제공하지만 journal·revision catalog·save handler는 아직 없다."
        - "appendJournalPayloadDurably는 caller path·checksum adapter를 받아 frame 전체 write와 FileHandle.sync 성공 뒤 byte range를 반환한다."
      command_contract:
        - "입력은 strict ChangeBatch v1이며 기존 target validator와 현재 journal head의 work·document·base revision·next sequence·본문 길이를 append 전에 검증한다."
        - "여러 save 호출은 application command 안에서 순차 실행해 frame과 sequence가 interleave되지 않게 한다."
        - "same batch identity·canonical bytes는 같은 session에서 기존 SaveReceipt를 반환하고 다시 append하지 않는다."
        - "identity conflict·gap·stale·overflow·본문 apply 충돌은 append하지 않는다."
        - "append 또는 sync 실패 시 journal head·accepted identity·SaveReceipt 상태를 전진시키지 않는다."
        - "SaveReceipt는 work·document·base revision·batch identity·sequence와 durable frame byte range를 식별하며 append port가 성공한 뒤에만 생성한다."
      deferred:
        - "journal path와 checksum adapter는 다음 desktop/platform wiring에서 runtime input으로 주입한다."
        - "batch 크기·지연은 성능 시험 전에는 제품값으로 고정하지 않는다."
        - "typed IPC와 renderer 네 상태 연결은 application command 다음 Worker에서 진행한다."
      operator_approval_needed: false
