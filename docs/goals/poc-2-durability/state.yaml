        - "base UTF-16 좌표의 ordered changes를 현재 journal head에 원자 적용"
        - "동일 batch identity·bytes의 idempotent duplicate를 정확히 한 번 적용"
        - "sequence gap·stale·overflow와 작품·문서·base revision 경계에서 replay 중단"
        - "중단 전 verified replay 결과만 보존"
      red:
