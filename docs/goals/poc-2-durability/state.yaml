        - "canonical payload parser missing RED 확인"
        - "두 번째 연속 batch를 durable base 길이와 잘못 비교하는 validator RED 확인"
        - "replay-journal module missing RED 확인"
        - "MAX_SAFE_INTEGER 다음 sequence overflow RED 확인"
      commands:
