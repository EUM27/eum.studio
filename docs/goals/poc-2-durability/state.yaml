  - id: T005
    type: judge
    assignee: Judge
    status: done
    reasoning_hint: high
    objective: "기존 editor transaction·typed bridge·desktop lifecycle을 읽어 durable acknowledgement 저장 명령의 정확한 승인 경계와 첫 Worker 범위를 결정한다."
