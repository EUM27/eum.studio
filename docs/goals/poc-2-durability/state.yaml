        - "src/platform/journal/journal-frame.ts"
        - "src/platform/journal/journal-frame.test.ts"
        - "src/platform/journal/append-only-journal.ts"
        - "src/platform/journal/append-only-journal.integration.test.ts"
        - "docs/poc-2-journal.md"
        - "README.md"
        - "plan.md"
      requirements:
        - "append-only journal record framing"
        - "payload length and checksum"
        - "append then durable flush ordering"
        - "torn/truncated/corrupted tail에서 이전 정상 prefix 복구"
      red:
