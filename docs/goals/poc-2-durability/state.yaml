        - "append-only-journal module missing RED 확인"
        - "첫 integration filter는 기존 Vitest include 밖이어서 제품 동작 없이 test 위치만 src 관례로 이동 후 올바른 RED 재확인"
      commands:
        - cmd: "npm run test:run -- src/platform/journal/journal-frame.test.ts src/platform/journal/append-only-journal.integration.test.ts"
          status: pass
          result: "2 files, 4 tests"
        - cmd: "npm run typecheck"
          status: pass
        - cmd: "npm run check"
          status: pass
          result: "lint, typecheck, 27 files and 106 tests, production build"
        - cmd: "git diff --check"
          status: pass
      summary: "주입 checksum adapter를 사용하는 self-describing canonical frame, 실제 file append+sync, verified prefix와 손상 tail 분리를 구현했다. main·renderer와 실사용 저장에는 연결하지 않았다."
      next_allowed_task: T004

