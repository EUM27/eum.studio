version: 2

goal:
  title: "POC-2 — 영속화·강제 종료"
  slug: "poc-2-durability"
  kind: existing_plan
  tranche: "승인된 POC-2 전체를 successive safe verified slices로 완료한다."
  status: done
  oracle:
    signal: "실제 process kill 뒤 마지막 durable sequence와 복구 checksum이 일치하고, ack 전 변경·duplicate·gap·손상 tail·교차 작품/문서·저장 실패가 승인된 POC-2 통과 조건대로 분류된다."
    cadence: "각 crash·성능·installed-package artifact 생성 뒤와 최종 전체 audit에서 확인한다."
    final_proof: "전체 check·production-bundle Electron E2E·9개 actual-process kill matrix·3개 독립 성능 실행·installed-package 강제 종료/복구 실행의 최신 pass receipt와 artifact-embedded exact source provenance가 모두 일치해야 한다."
  intake:
    original_request: "POC 2 전체 골잡고 시작"
    interpreted_outcome: "durable ack 이후 강제 종료해도 정확한 작품·문서 원고를 손실 없이 복구하는 POC-2 전체를 구현·검증한다."
    input_shape: existing_plan
    audience: "이음 스튜디오 사용자"
    authority: approved
    proof_type: test
    completion_proof: "POC-2 통과 조건을 최신 정적·단위·통합·production-bundle·installed-package·kill harness·성능/메모리 증거로 모두 충족한다."
    likely_misfire: "journal append만 구현하고 durable flush·ack·replay·손상 tail·crash matrix 검증 없이 완료로 판정한다."
    blind_spots_considered:
      - "IME 확정·미확정 저장 경계"
      - "ack 유실·중복"
      - "replay 도중 재종료"
      - "checkpoint·compaction 중 종료"
      - "production-bundle과 installed-package 증거 구분"
    existing_plan_facts:
      - "append-only journal은 POC-2 범위다."
      - "SQLite와 FTS 결정은 POC-3로 미룬다."
      - "저장 문자열과 ChangeBatch v1 계약은 현재 미커밋 작업 트리에 구현돼 있다."
      - "saved 표시는 durable flush 이후에만 허용한다."
      - "duplicate replay는 멱등이며 sequence gap과 손상 tail은 격리한다."

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true

agents:
  scout: installed
  worker: installed
  judge: bundled_not_installed

visual_board:
  selected: none
  local:
    status: not_requested
    url: null
    command: "npx goalbuddy board docs/goals/poc-2-durability"
  github_projects:
    status: not_requested
    url: null
    command: "npx goalbuddy extend github-projects"
    missing: []

active_task: null

tasks:
  - id: T001
    type: pm
    assignee: PM
    status: done
    reasoning_hint: high
    objective: "현재 저장소 지침·승인 설계 checksum·Git 상태·미커밋 ChangeBatch 계약을 검증하고 POC-2 실행 단위를 확정한다."
    inputs:
      - "AGENTS.md"
      - "README.md"
      - "plan.md"
      - "docs/design-baseline.md"
      - "현재 단계의 승인 설계 원문"
      - "현재 Git diff"
    constraints:
      - "구현 파일을 수정하지 않는다."
      - "D:\\eum.editor를 읽거나 쓰지 않는다."
      - "저장소 문서와 Git 상태를 source of truth로 사용한다."
    expected_output:
      - "checksum 판정"
      - "dirty worktree fingerprint"
      - "현재 완료/미완료 경계"
      - "다음 exact task와 allowed_files·verify·stop_if"
    receipt:
      result: done
      summary: "승인 원문 checksum, Git 동기화, 기존 ChangeBatch 계약과 검증 상태를 확인해 POC-2 다음 단위를 append-only journal framing 판단으로 확정했다."
      evidence:
        - "승인 원문 11개 SHA-256이 docs/design-baseline.md와 모두 일치"
        - "main HEAD 6b8414d, upstream ahead/behind 0/0, staged·conflict 없음"
        - "기존 미커밋 제품 변경 7개를 보존 대상으로 식별"
        - "제품 변경 dirty fingerprint F1ED07AE199349500EDFDABE71E7AAC06B4052E94D24CC166C3EAC6A47BA60ED"
      commands:
        - cmd: "npm run test:run -- src/application/persistence/change-batch.test.ts src/application/persistence/validate-change-batch-target.test.ts"
          status: pass
          result: "2 files, 14 tests"
        - cmd: "npm run check"
          status: pass
          result: "lint, typecheck, 25 files and 102 tests, production build"
        - cmd: "git diff --check"
          status: pass
      next_allowed_task: T002

  - id: T002
    type: judge
    assignee: Judge
    status: done
    reasoning_hint: high
    objective: "승인 요구에 맞는 append-only record framing·length·checksum·flush 계약을 결정하고 첫 Worker 범위를 잠근다."
    inputs:
      - "T001 receipt"
      - "docs/poc-2-durable-change-batch.md"
      - "승인 storage ADR와 POC 실행 계획"
    constraints:
      - "구현하지 않는다."
      - "승인 문서가 정하지 않은 제품 behavior를 새 요구사항으로 만들지 않는다."
      - "SQLite를 선택하지 않는다."
    expected_output:
      - "framing·checksum·flush decision 또는 operator approval 필요 항목"
      - "exact Worker objective"
      - "allowed_files"
      - "verify"
      - "stop_if"
    receipt:
      result: done
      decision: "checksum 알고리즘을 고정하지 않고 adapter로 주입하며, self-describing canonical header·payload·checksum binary frame과 FileHandle.sync 이후 durable 반환 계약을 사용한다."
      evidence:
        - "승인 ADR 5.1은 journal append 후 durable acknowledgement만 saved로 표시하도록 요구한다."
        - "승인 ADR 5.2는 작품·문서·base revision·sequence·changes·createdAt·전후 검증값·client command ID를 journal record에 요구한다."
        - "Node.js 24 공식 문서는 FileHandle.sync가 open descriptor의 모든 data를 storage device로 flush하도록 요청하며 OS·device별 구현임을 명시한다."
        - "Node.js 24 공식 문서는 같은 FileHandle의 write를 await 없이 중첩하는 것이 unsafe하다고 명시한다."
      framing:
        prefix: "4-byte unsigned big-endian canonical header byte length"
        header: "[journal-entry, schemaVersion, checksumAdapterId, payloadByteLength, checksumByteLength]을 JSON.stringify 후 UTF-8 encoding"
        payload: "serializeCanonicalChangeBatch가 만든 bytes"
        checksum_input: "canonical header bytes 뒤에 payload bytes를 연결한 값"
        checksum: "주입 adapter가 반환한 정확한 checksumByteLength bytes"
      flush_contract:
        - "한 frame의 모든 bytes를 순차 write하고 partial write가 있으면 남은 bytes를 이어 쓴다."
        - "FileHandle.sync 성공 전에는 durable 결과나 SaveReceipt를 반환하지 않는다."
        - "write 또는 sync 실패는 성공으로 바꾸거나 retry하지 않는다."
        - "close는 finally에서 실행하며 sync 실패를 숨기지 않는다."
      recovery_contract:
        - "scanner는 첫 invalid·checksum mismatch·truncated frame에서 멈춘다."
        - "그 이전 verified prefix만 반환하고 tail offset·reason·원시 tail bytes를 보존한다."
        - "손상 뒤 bytes를 resync해 적용하지 않는다."
      operator_approval_needed: false
      next_allowed_task: T003

  - id: T003
    type: worker
    assignee: Worker
    status: done
    reasoning_hint: medium
    objective: "Judge가 승인한 범위에서 append-only journal framing·checksum·flush와 정상 prefix·손상 tail 복구를 TDD로 구현한다."
    allowed_files:
