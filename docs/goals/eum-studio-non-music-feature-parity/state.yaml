        lint: "passed"
        typecheck: "passed"
        electron_e2e: "1 passed"
      full_outcome_complete: false

  - id: T005
    type: judge
    assignee: Judge
    status: done
    reasoning_hint: high
    objective: "이전 화 흐름이 레거시 계약과 현재 소유권 경계를 만족하는지 감사하고 다음 회차 관리 단위를 선택한다."
    inputs:
