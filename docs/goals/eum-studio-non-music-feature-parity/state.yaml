# GoalBuddy v2 state.yaml
# Board truth lives here. goal.md is the editable charter; notes/ holds long receipts only.

version: 2

goal:
  title: "이음 스튜디오 비음악 기능 완성"
  slug: "eum-studio-non-music-feature-parity"
  kind: existing_plan
  tranche: "음악을 제외한 레거시 기능 전체를 안전한 검증 단위로 연속 구현"
  status: blocked
  intake:
    original_request: "음악은 일단 빼고 나머지는 목표 삼아서 구현 시작해"
    interpreted_outcome: "레거시에서 확인한 음악 제외 기능을 현재 스튜디오 아키텍처로 구현하고 실제 앱에서 검증한다."
    input_shape: existing_plan
    audience: "이음 스튜디오 장편 집필 사용자"
    authority: requested
    proof_type: demo
    completion_proof: "음악 제외 기능 인벤토리 전체가 실제 패키징 Electron 앱에서 동작하고 좁은 테스트와 전체 검사가 통과하며 최종 감사 receipt가 full_outcome_complete true를 기록한다."
    likely_misfire: "화면 껍데기만 만들거나 레거시를 통째로 복사해 현재 소유권·선택 범위·불변 저장 경계를 훼손하는 것."
    blind_spots_considered:
      - "현재 working tree에 사용자 소유 변경이 31개 경로 존재한다."
      - "plan.md는 POC-M을 다음 Gate로 지정한다."
      - "이전 화 200자 흐름과 전 회차 연속 읽기는 별도 기능이다."
      - "조수와 투고 외부 연결은 권한·비밀·자격 증명 경계가 필요하다."
    existing_plan_facts:
      - "POC-3은 완료됐고 POC-M이 다음 Gate다."
      - "이전 화 흐름을 첫 사용자 기능 단위로 복원한다."
      - "빈 회차 제목은 정확히 제목없음으로 생성한다."
      - "D:\\eum.editor는 읽기 전용이다."
      - "Lazyweb과 하드코딩을 사용하지 않는다."
      - "커밋과 푸시는 별도 요청 전 수행하지 않는다."

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true

agents:
  scout: installed
  worker: installed
  judge: bundled_not_installed

visual_board:
  selected: none
  local:
    status: not_requested
    url: null
    command: "npx goalbuddy board docs/goals/eum-studio-non-music-feature-parity"
  github_projects:
    status: not_requested
    url: null
    command: "npx goalbuddy extend github-projects"
    missing: []

active_task: null

tasks:
  - id: T001
    type: pm
    assignee: PM
    status: done
    reasoning_hint: high
    objective: "현재 Gate와 레거시 기능 인벤토리를 대조해 음악 제외 목표의 실행 순서와 첫 이전 화 흐름 단위를 확정한다."
    inputs:
      - "AGENTS.md"
      - "README.md"
      - "plan.md"
      - "docs/design-baseline.md"
      - "docs/gate-0-runtime.md"
      - "D:\\eum.editor read-only source"
      - "현재 git diff와 status"
    constraints:
      - "읽기 전용 조사와 goal control file 갱신만 허용한다."
      - "기존 POC Gate를 임의로 폐기하지 않는다."
      - "음악 관련 작업을 생성하지 않는다."
      - "사용자 소유 dirty 변경을 되돌리지 않는다."
    expected_output:
      - "Gate와 기능 목표의 충돌 여부"
      - "우선순위가 매겨진 실행 tranche"
      - "이전 화 흐름의 정확한 source owners와 검증 명령"
      - "T002 또는 신규 Worker의 allowed_files, verify, stop_if"
    receipt:
      outcome: "현재 승인 설계와 POC Gate를 유지하면서 이전 화 흐름을 완결된 집필 코어 위의 첫 파생 사용자 기능으로 구현할 수 있다. POC-M 이후 기능은 기존 Gate 순서를 유지한다."
      evidence:
        - "승인 설계 manifest 11개 checksum 일치"
        - "plan.md는 POC-3 완료와 POC-M 다음 Gate를 명시"
        - "현재 branch main, staged 0, conflicts 0, 기존 dirty 변경 보존"
        - "레거시는 직전 회차 원문 끝부분 약 200자를 문장·문단 경계로 파생해 CodeMirror 위치 0의 읽기 전용 widget으로 표시"
        - "현재 ManuscriptDocumentProfile.documents가 순서를, ManuscriptDocumentStateRegistry가 최신 문서별 EditorState를 소유"
      ordered_tranches:
        - "이전 화 흐름"
        - "회차·작품 관리"
        - "POC-M과 이후 승인 Gate"
        - "원고 도구, 파편·복선, 인물·플롯·구조, 기록·버전·집중, 별빛·검토함, 홈·설정, 조수, 투고 운영"
      first_slice:
        owners:
          - "src/application/editor"
          - "src/renderer/editor/ManuscriptEditor.tsx"
          - "src/renderer/App.tsx"
          - "src/renderer/styles.css"
          - "tests/e2e/desktop-shell.spec.ts"
        verification:
          - "success-path unit tests for preview derivation and ownership"
          - "TypeScript and lint"
          - "focused packaged Electron E2E"
      full_outcome_complete: false

  - id: T002
    type: scout
    assignee: Scout
    status: done
    reasoning_hint: medium
    objective: "레거시 이전 화 흐름과 현재 workspace/editor 데이터 소유자를 대조해 정확한 구현 경계를 찾는다."
    inputs:
      - "T001 receipt"
      - "D:\\eum.editor\\src\\app\\editor\\flow-preview.ts"
      - "D:\\eum.editor\\src\\app\\use-app-derived-state.ts"
      - "D:\\eum.editor\\src\\editor\\CodeMirrorManuscriptSurface.tsx"
      - "src/application"
      - "src/renderer"
      - "tests/e2e"
    constraints:
      - "읽기 전용이다."
      - "직전 회차가 없거나 원문이 비면 preview를 숨긴다."
      - "현재 회차나 다른 작품 원문으로 fallback하지 않는다."
    expected_output:
      - "데이터 흐름 지도"
      - "정확한 소유 파일"
      - "성공 경로 검증"
      - "bounded Worker task"
    receipt:
      outcome: "직전 회차 흐름은 새 저장 원본 없이 현재 작품의 정렬된 document profile과 편집기의 문서별 최신 EditorState에서 파생할 수 있다."
      data_flow:
        - "App의 activeWorkDocuments가 현재 작품 문서만 profile 순서대로 전달"
        - "ManuscriptEditor가 전환 직전 현재 EditorState를 ManuscriptDocumentStateRegistry에 저장"
        - "직전 문서의 registry text가 있으면 사용하고, 아직 열지 않은 문서는 같은 profile의 initialText를 사용"
        - "순수 preview 함수가 줄바꿈을 정규화하고 끝 문장·문단을 약 200자까지 선택"
        - "CodeMirror 위치 0의 읽기 전용 decoration이 제목과 preview를 표시하며 doc/selection/history에는 포함되지 않음"
      owners:
        legacy:
          - "D:\\eum.editor\\src\\app\\editor\\flow-preview.ts"
          - "D:\\eum.editor\\src\\app\\use-app-derived-state.ts"
          - "D:\\eum.editor\\src\\editor\\CodeMirrorManuscriptSurface.tsx"
        current:
          - "src/application/editor"
          - "src/renderer/editor/ManuscriptEditor.tsx"
          - "src/renderer/App.tsx"
          - "src/renderer/styles.css"
      success_paths:
        - "첫 회차에서는 숨김"
        - "직전 회차가 비어 있으면 숨김"
        - "두 번째 회차에서는 직전 회차 제목과 최신 끝 흐름 표시"
        - "다른 작품 문서와 현재 회차를 fallback으로 사용하지 않음"
        - "preview 표시 후에도 원고 선택·undo·저장 text가 변하지 않음"
      bounded_worker: "순수 preview/소유권 파생, CodeMirror 읽기 전용 widget, App의 동일 작품 문서 순서 전달, focused unit/Electron E2E만 구현"
      full_outcome_complete: false

