        - "npx eslint src/application/editor/previous-episode-flow.ts src/application/editor/previous-episode-flow.test.ts src/renderer/editor/previous-episode-flow-extension.ts src/renderer/editor/ManuscriptEditor.tsx src/renderer/App.tsx tests/e2e/desktop-shell.spec.ts"
