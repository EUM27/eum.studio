version: 2

goal:
  title: "승인 POC 실행 계획 전체 완료"
  slug: "approved-poc-plan-completion"
  kind: existing_plan
  tranche: "POC-3, POC-M, POC-4를 순서대로 successive safe verified slices로 완료하고 각 Gate를 커밋·푸시한다."
  status: active
  oracle:
    signal: "각 Gate의 승인 통과 조건과 최신 실행 artifact가 일치하고 최종 audit가 전체 POC 완료를 판정한다."
    cadence: "각 Worker receipt, Gate audit, 커밋·푸시와 최종 전체 audit에서 확인한다."
    final_proof: "POC-3 저장·blob·backup, POC-M 봉인 source 이주·멱등성·복원, POC-4 OAuth·secret 경계의 최신 정적·단위·통합·desktop·installed-package·실패 주입 증거와 Gate별 push receipt"
  intake:
    original_request: "POC-2만 말고 전부 끝까지"
    interpreted_outcome: "승인 POC 계획의 남은 모든 Gate를 구현·검증하고 각 단계별 커밋·푸시한 뒤 전체 완료를 증명한다."
    input_shape: existing_plan
    audience: "이음 스튜디오 사용자"
    authority: approved
    proof_type: artifact
    completion_proof: "POC-3·POC-M·POC-4 통과 조건을 최신 증거로 충족하고 최종 audit가 full_outcome_complete true를 기록한다."
    likely_misfire: "한 POC adapter를 제품 결정으로 과대 해석하거나 한 Gate만 완료하고 전체 목표를 종료한다."
    blind_spots_considered:
      - "Electron ABI와 native addon packaging"
      - "backup·restore 중 종료와 blob 변조"
      - "레거시 snapshot 봉인과 source checksum"
      - "미매핑·고아 데이터 raw preservation"
      - "이주 멱등성·취소·target 복원"
      - "OAuth state·PKCE·callback ownership"
      - "renderer·로그·localStorage secret 비노출"
      - "실제 제공자 자격 증명 부재"
    existing_plan_facts:
      - "POC-3은 driver bake-off 뒤 SQLite·불변 blob·backup을 검증한다."
      - "POC-M은 POC-2와 POC-3 통과 뒤 봉인한 레거시 source snapshot에서 rehearsal한다."
      - "POC-4는 fake provider 시나리오와 비밀 저장·callback 경계를 검증한다."
      - "connector UI와 음악 SDK POC는 첫 출시 핵심 폐회로를 차단하지 않는다."
      - "각 Gate 완료 뒤 커밋하고 origin/main에 푸시한다."

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true

agents:
  scout: installed
  worker: installed
  judge: bundled_not_installed

visual_board:
  selected: none
  local:
    status: not_requested
    url: null
    command: "npx goalbuddy board docs/goals/approved-poc-plan-completion"
  github_projects:
    status: not_requested
    url: null
    command: "npx goalbuddy extend github-projects"
    missing: []

