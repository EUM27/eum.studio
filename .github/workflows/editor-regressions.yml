name: Editor regression verification

on:
  push:
    branches: [fix/editor-regressions-20260914]
    paths: [.github/workflows/editor-regressions.yml]

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install locked dependencies without upgrades
        run: |
          cp package-lock.json "$RUNNER_TEMP/original-lock.json"
          trap 'cp "$RUNNER_TEMP/original-lock.json" package-lock.json' EXIT
          # The committed lock omits the root entry required by wasm-runtime.
          # Reuse the exact already-locked nested package, never a newer version.
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const path = 'package-lock.json';
          const lock = JSON.parse(readFileSync(path, 'utf8'));
          const root = 'node_modules/@emnapi/runtime';
          const pinned = lock.packages['node_modules/@rolldown/binding-wasm32-wasi/node_modules/@emnapi/runtime'];
          if (!lock.packages[root]) {
            if (!pinned?.integrity || !pinned?.resolved) throw new Error('Missing pinned runtime');
            lock.packages[root] = structuredClone(pinned);
            writeFileSync(path, JSON.stringify(lock, null, 2) + '\n');
          }
          NODE
          npm ci --no-audit --no-fund
      - name: Export isolated verification runtime
        run: |
          mkdir -p "$RUNNER_TEMP/editor-runtime/bin" "$RUNNER_TEMP/editor-runtime/lib/node_modules"
          cp "$(command -v node)" "$RUNNER_TEMP/editor-runtime/bin/node"
          cp -a "$(npm root -g)/npm" "$RUNNER_TEMP/editor-runtime/lib/node_modules/npm"
          tar -czf "$RUNNER_TEMP/editor-dependencies.tar.gz" node_modules
          tar -czf "$RUNNER_TEMP/editor-node.tar.gz" -C "$RUNNER_TEMP" editor-runtime
      - uses: actions/upload-artifact@v7
        with:
          name: editor-runtime
          path: |
            ${{ runner.temp }}/editor-dependencies.tar.gz
            ${{ runner.temp }}/editor-node.tar.gz
          retention-days: 1
          compression-level: 0
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        if: success() || failure()
        run: npm run lint
      - name: Unit and integration tests
        if: success() || failure()
        run: npm run test:run
      - name: Build
        if: success() || failure()
        run: npm run build
