name: Required core verification

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  required-core:
    name: Required core (Windows)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci
      - name: Run required checks and production Electron workflows
        run: npm run verification:core -- --run-id "ci-core-${{ github.run_id }}-${{ github.run_attempt }}"
      - name: Retain verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: required-core-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/verification/*/verification.json
            artifacts/verification/*/*.log
            artifacts/verification/*/playwright-results.json
            artifacts/verification/*/traces/**/trace.zip
          if-no-files-found: warn
          retention-days: 14
